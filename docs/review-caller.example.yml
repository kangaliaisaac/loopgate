name: review

# Copy into a repo as .github/workflows/review.yml. Replace <ref> with a loopgate tag or SHA.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: kangaliaisaac/loopgate/.github/workflows/claude-review.yml@<ref>
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
